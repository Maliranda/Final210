name: vocabulary

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vocabulary
      POSTGRES_PASSWORD: vocabulary
      POSTGRES_DB: vocabulary
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabulary -d vocabulary"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./api
    ports:
      - "8088:8080"
    environment:
      PORT: "8080"
      APP_VERSION: local
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vocabulary
      PGPASSWORD: vocabulary
      PGDATABASE: vocabulary
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
