<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#f7f5f0"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="26" fill="#1c1917">Vocabulary Builder — local track</text>
  <text x="40" y="68" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#44403c">Two API replicas. One database. The cluster is created by Terraform and thrown away with terraform destroy.</text>

  <rect x="40" y="100" width="220" height="70" rx="8" fill="#ffffff" stroke="#1c1917"/>
  <text x="150" y="130" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1917">Learner</text>
  <text x="150" y="152" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#57534e">curl :30080</text>

  <rect x="340" y="100" width="720" height="430" rx="10" fill="#fffefb" stroke="#1c1917"/>
  <text x="360" y="128" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1917">kind cluster “vocabulary” — Terraform</text>

  <rect x="370" y="150" width="200" height="90" rx="8" fill="#e7e5e4" stroke="#1c1917"/>
  <text x="470" y="182" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1917">control-plane</text>
  <text x="470" y="204" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">NodePort 30080</text>
  <text x="470" y="222" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">host 127.0.0.1:30080</text>

  <rect x="600" y="150" width="200" height="90" rx="8" fill="#ffffff" stroke="#1c1917"/>
  <text x="700" y="190" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1917">Service</text>
  <text x="700" y="212" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">vocabulary-api</text>

  <rect x="370" y="280" width="250" height="110" rx="8" fill="#ffffff" stroke="#1c1917"/>
  <text x="495" y="312" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1917">worker — app</text>
  <text x="495" y="336" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#44403c">API replica</text>
  <text x="495" y="356" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#57534e">this is the node we drain</text>

  <rect x="660" y="280" width="360" height="210" rx="8" fill="#ffffff" stroke="#1c1917"/>
  <text x="840" y="312" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1917">worker — database</text>
  <text x="840" y="338" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#44403c">API replica</text>
  <text x="840" y="362" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#44403c">Postgres (one pod)</text>
  <text x="840" y="386" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#57534e">PersistentVolume, hostPath</text>
  <text x="840" y="410" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#57534e">single point of failure for the data</text>
  <text x="840" y="450" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">ConfigMap + Secret</text>

  <rect x="40" y="560" width="1020" height="120" rx="10" fill="#ffffff" stroke="#1c1917"/>
  <text x="60" y="592" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1917">On every push and pull request</text>
  <text x="60" y="622" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#44403c">GitHub Actions: lint, then test (JUnit artifact even on failure), then build the image.</text>
  <text x="60" y="646" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#44403c">A push to main also pushes ghcr.io/maliranda/final210. The cluster runs vocabulary-api:local, loaded with kind load.</text>

  <line x1="260" y1="135" x2="340" y2="135" stroke="#1c1917" stroke-width="1.5"/>
  <line x1="570" y1="195" x2="600" y2="195" stroke="#1c1917" stroke-width="1.5"/>
  <line x1="700" y1="240" x2="700" y2="270" stroke="#1c1917" stroke-width="1.5"/>
  <line x1="620" y1="270" x2="495" y2="280" stroke="#1c1917" stroke-width="1.5"/>
  <line x1="780" y1="270" x2="840" y2="280" stroke="#1c1917" stroke-width="1.5"/>
</svg>
